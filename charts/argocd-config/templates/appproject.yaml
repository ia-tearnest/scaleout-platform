# Management Project
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mgmt
  namespace: argocd
  annotations:
    "helm.sh/resource-policy": keep
    "argocd.argoproj.io/sync-options": "Prune=false"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Management cluster infrastructure"
  sourceRepos:
    - "git@github.com:example-org/platform.git"
  destinations:
    - namespace: "*"
      server: "https://kubernetes.default.svc"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

---
# Development Project
apiVersion: argoproj.io/v1alpha1
