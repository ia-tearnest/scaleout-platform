# ArgoCD repository definition
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-platform
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: platform-repo-ro
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: "git@github.com:example-org/platform.git"
        sshPrivateKey: '{{ "{{" }} .ssh_key | toString {{ "}}" }}'
        insecure: "true"
        name: example-platform
  data:
    - secretKey: ssh_key
      remoteRef:
        key: "example/platform/platform-repo-ro"
        property: ssh_key
---
# GitHub webhook secret for ArgoCD
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-webhook-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: webhook.github.secret
      remoteRef:
        key: "example/platform/argocd-webhook"
        property: secret
