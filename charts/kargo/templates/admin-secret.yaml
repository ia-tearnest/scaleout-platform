# Kargo admin account credentials - synced from AWS Secrets Manager
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-admin-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: kargo-admin-secret
    creationPolicy: Owner
  data:
  - secretKey: ADMIN_ACCOUNT_PASSWORD_HASH
    remoteRef:
      key: example/platform/kargo-admin
      property: ADMIN_ACCOUNT_PASSWORD_HASH
  - secretKey: ADMIN_ACCOUNT_TOKEN_SIGNING_KEY
    remoteRef:
      key: example/platform/kargo-admin
      property: ADMIN_ACCOUNT_TOKEN_SIGNING_KEY
