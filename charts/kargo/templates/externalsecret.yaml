# ExternalSecrets for Kargo repo credentials
---
# App repo credentials - for warehouse to read tags from app-repo
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: example-app-repo
  namespace: kargo-example
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: example-app-repo
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
  data:
  - secretKey: sshPrivateKey
    remoteRef:
      key: example/platform/app-repo-readonly
      property: sshPrivateKey
      decodingStrategy: "Base64"
  - secretKey: repoURL
    remoteRef:
      key: example/platform/app-repo-readonly
      property: url

---
# Platform repo credentials - for promotion to push to example-platform
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: example-platform-repo
  namespace: kargo-example
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: example-platform-repo
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
  data:
  - secretKey: sshPrivateKey
    remoteRef:
      key: example/platform/platform-repo-readwrite
      property: sshPrivateKey
      decodingStrategy: "Base64"
  - secretKey: repoURL
    remoteRef:
      key: example/platform/platform-repo-readwrite
      property: url

---
# GitHub webhook secret for ClusterConfig - in kargo-system-resources namespace
# Note: ClusterConfig requires secrets in kargo-system-resources (workaround for Kargo 1.9.2 bug)
# See: docs/issues/kargo-1.9.2-webhook-cache-bug.md
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-webhook-secret
  namespace: kargo-system-resources
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: github-webhook-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          kargo.akuity.io/cred-type: generic
  data:
  - secretKey: secret
    remoteRef:
      key: example/platform/github-webhook-secret
      property: secret
