{{- if .Values.ingress.useTraefik }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  name: mgmt-keycloak-tcp
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`{{ .Values.ingress.hostname }}`)
      services:
        - name: mgmt-service
          port: 8443
  tls:
    passthrough: true
{{- end }}
