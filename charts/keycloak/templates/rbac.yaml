apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  name: keycloak-operator-view
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: view
subjects:
  - kind: ServiceAccount
    name: keycloak-operator
{{- if .Values.pgoSecretSync.enabled }}
---
# ServiceAccount for reading PGO secrets (used by External Secrets)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.pgoSecretSync.serviceAccountName | default "keycloak-pgo-reader" }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
{{- end }}