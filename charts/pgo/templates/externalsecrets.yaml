{{/*
ClusterSecretStore for allowing site namespaces to read PGO-generated ignition credentials.
*/}}
{{- if .Values.ignitionSecretAccess }}
{{- if .Values.ignitionSecretAccess.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: pgo-ignition-credentials
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: kube-system
          key: ca.crt
      auth:
        serviceAccount:
          name: pgo-ignition-reader
          namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
---
{{/*
ClusterSecretStore for allowing n8n namespace to read PGO-generated n8n credentials.
*/}}
{{- if .Values.n8nSecretAccess }}
{{- if .Values.n8nSecretAccess.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
