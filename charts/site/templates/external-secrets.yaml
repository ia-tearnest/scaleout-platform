---
# GitOps SSH Key Secret (used by Stoker for app repo authentication)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: git-sync-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: git-sync-secret
    creationPolicy: Owner
  data:
  - secretKey: ssh
    remoteRef:
      key: {{ .Values.externalSecrets.secretName | default .Release.Namespace }}
      property: GIT_SYNC_SSH
  - secretKey: known_hosts
    remoteRef:
      key: {{ .Values.externalSecrets.secretName | default .Release.Namespace }}
      property: GIT_SYNC_KNOWN_HOSTS
