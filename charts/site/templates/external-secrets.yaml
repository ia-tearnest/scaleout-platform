{{- if .Values.sharedGanCA.secretSync.enabled }}
---
# GAN CA certificate from cert-manager namespace
# Copies the shared CA cert so gateways can mount it for GAN trust
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.sharedGanCA.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gan-ca-credentials
    kind: ClusterSecretStore
  target:
    name: {{ .Values.sharedGanCA.name }}
    creationPolicy: Owner
  data:
  - secretKey: tls.crt
    remoteRef:
      key: {{ .Values.sharedGanCA.name }}
      property: tls.crt
{{- end }}
{{- if .Values.database }}
{{- if .Values.database.enabled }}
---
# Database credentials from PGO
# Pulls credentials from pgo-pguser-ignition secret in pgo namespace
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ignition-db-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: pgo-ignition-credentials
    kind: ClusterSecretStore
  target:
    name: ignition-db-credentials
    creationPolicy: Owner
  data:
  - secretKey: jdbc-uri
    remoteRef:
      key: {{ .Values.database.pgoSecretName | default "pgo-pguser-ignition" }}
      property: jdbc-uri
  - secretKey: host
    remoteRef:
      key: {{ .Values.database.pgoSecretName | default "pgo-pguser-ignition" }}
      property: host
  - secretKey: port
    remoteRef:
      key: {{ .Values.database.pgoSecretName | default "pgo-pguser-ignition" }}
      property: port
  - secretKey: dbname
    remoteRef:
      key: {{ .Values.database.pgoSecretName | default "pgo-pguser-ignition" }}
      property: dbname
  - secretKey: user
    remoteRef:
      key: {{ .Values.database.pgoSecretName | default "pgo-pguser-ignition" }}
      property: user
  - secretKey: password
    remoteRef:
      key: {{ .Values.database.pgoSecretName | default "pgo-pguser-ignition" }}
      property: password
{{- end }}
{{- end }}