argo-cd:
  global:
    domain: argocd.mgmt.example.com
  server:
    ingress:
      annotations:
        kubernetes.io/ingress.class: alb
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/backend-protocol: HTTP
        alb.ingress.kubernetes.io/load-balancer-name: alb-mgmt-ext
        alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-3-PQ-2025-09
        alb.ingress.kubernetes.io/group.name: alb-mgmt-ext-group
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
        alb.ingress.kubernetes.io/ssl-redirect: '443'
        alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-west-2:123456789012:certificate/00000000-0000-0000-0000-000000000000
        alb.ingress.kubernetes.io/healthcheck-path: /healthz
        alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
        alb.ingress.kubernetes.io/success-codes: 200,302
        external-dns.alpha.kubernetes.io/ttl: "60"
        external-dns.alpha.kubernetes.io/hostname: argocd.mgmt.example.com
      ingressClassName: alb
  configs:
    cm:
      kustomize.buildOptions: --enable-helm
      timeout.reconciliation: 15s
      ui.theme: "auto"
      oidc.config: |
        name: Keycloak
        issuer: https://auth.example.com/realms/example
        clientID: argocd
        enablePKCEAuthentication: true
        requestedScopes: ["openid", "profile", "email", "groups"]
    params:
      server.insecure: true
    rbac:
      policy.default: role:readonly
      policy.csv: |
        g, argocd-admins, role:admin
        g, argocd-readonly, role:readonly
