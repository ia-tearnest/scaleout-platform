# Site Common - PRD Environment

# Stoker — GitOps sync operator (ref updated by Kargo promotions)
stoker:
  enabled: true
  git:
    ref: 0.0.25

database:
  enabled: true

# S3 Modules (AWS Mountpoint CSI Driver)
s3Modules:
  enabled: true
  bucketName: example-prd-ignition-modules

# YAML Anchors
x-image: &image
  tag: 8.3.10

be:
  image: *image
  gateway:
    dataVolumeStorageSize: 100Gi
    envFrom:
      - configMapRef:
          name: site-env
    env:
      GATEWAY_NETWORK_ALLOWEDPROXYHOPS: "0"
    gan:
      outgoingConnections:
        - host: gan.enterprise.prd.example.com
          port: 8060
  certManager:
    ganIssuer:
      create: false
      nameOverride: prd-site-gan-issuer
      kind: ClusterIssuer

# =============================================================================
# Shared GAN CA - All sites use ClusterIssuer for cross-site trust
# =============================================================================
sharedGanCA:
  name: prd-site-gan-issuer
  secretSync:
    enabled: true

fe:
  image: *image
  gateway:
    dataVolumeStorageSize: 100Gi
    envFrom:
      - configMapRef:
          name: site-env
    env:
      GATEWAY_NETWORK_ALLOWEDPROXYHOPS: "0"
  certManager:
    ganIssuer:
      nameOverride: prd-site-gan-issuer
      kind: ClusterIssuer

block1:
  image: *image
  gateway:
    envFrom:
      - configMapRef:
          name: block-1-env
    env:
      GATEWAY_NETWORK_ALLOWEDPROXYHOPS: "0"
  certManager:
    ganIssuer:
      nameOverride: prd-site-gan-issuer
      kind: ClusterIssuer
